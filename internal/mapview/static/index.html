<!--
The live map's page: the map (a WebGL canvas for a scene model, a 2-D
canvas above it for the plan view and overlay items), the floating chip
bar, and one panel that is a bottom sheet on phones and a side panel on
wider screens. app.js fills it in.
-->
<html lang="en">
<head>
<base href="/map/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>Glowstack live map</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="ui.css">
<script type="importmap">
{ "imports": {
  "three": "./third_party/three/build/three.module.min.js",
  "three/addons/": "./third_party/three/addons/"
} }
</script>
</head>
<body>
<main id="stage">
  <canvas id="gl" hidden></canvas>
  <canvas id="map"></canvas>
  <div id="chips" class="chipbar">
    <span class="brand" title="Glowstack live map" aria-label="Glowstack live map"><img class="brand-mark" src="logo.svg" width="24" height="24" alt=""><b>Glowstack</b></span>
    <span id="badge" class="badge">connecting…</span>
    <span class="seg" id="showSeg" role="group" aria-label="What the map shows">
      <button type="button" data-show="" title="Your preview layers, on the map only">Preview</button><button type="button" data-show="house" title="What the lights show">Lights</button>
    </span>
    <span class="seg views" id="viewChips" role="group" aria-label="Camera" hidden>
      <button type="button" data-view="street" title="The site's view">Street</button><button type="button" data-view="overhead" title="From above, north up">Overhead</button><button type="button" data-view="free" title="Where you last left the camera">Free</button>
    </span>
    <button type="button" id="fitBtn" class="chip" title="Fit the house to the screen (double-tap the map)">Fit</button>
  </div>
  <nav id="crumbs" class="crumbs" aria-label="Selection" hidden></nav>
  <div id="legend" class="legend" hidden></div>
  <div id="inspectCard" class="inspect card" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</main>

<aside id="panel" class="panel">
  <div id="handle" class="handle" aria-hidden="true"><i></i></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="looks" title="Looks"><span class="ico" aria-hidden="true">✦</span><span class="lbl">Looks</span></button>
    <button type="button" role="tab" data-tab="presets" title="Presets"><span class="ico" aria-hidden="true">▤</span><span class="lbl">Presets</span></button>
    <button type="button" role="tab" data-tab="setup" title="Setup"><span class="ico" aria-hidden="true">⚙</span><span class="lbl">Setup</span></button>
    <button type="button" role="tab" data-tab="status" title="Status"><span class="ico" aria-hidden="true">◉</span><span class="lbl">Status</span></button>
    <button type="button" id="railToggle" class="rail-toggle" title="Collapse the panel" aria-label="Collapse the panel"><span class="ico" aria-hidden="true">⇥</span></button>
  </div>
  <div id="content" class="content">
    <div id="inspectRow" class="inspect row" hidden></div>
    <section id="tab-looks" class="tab" role="tabpanel"></section>
    <section id="tab-presets" class="tab" role="tabpanel" hidden></section>
    <section id="tab-setup" class="tab" role="tabpanel" hidden></section>
    <section id="tab-status" class="tab" role="tabpanel" hidden></section>
  </div>
</aside>

<section id="calibrate" class="calibrate" hidden></section>

<script type="module" src="app.js"></script>
</body>
</html>
