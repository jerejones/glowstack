<!--
The live map's page: the map (a WebGL canvas for a scene model, a 2-D
canvas above it for the plan view and overlay items), the floating chip
bar, and one panel that is a bottom sheet on phones and a side panel on
wider screens. app.js fills it in.
-->
<html lang="en">
<head>
<base href="/map/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>Glowstack live map</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="ui.css">
<script type="importmap">
{ "imports": {
  "three": "./third_party/three/build/three.module.min.js",
  "three/addons/": "./third_party/three/addons/"
} }
</script>
</head>
<body>
<main id="stage">
  <canvas id="gl" hidden></canvas>
  <canvas id="map"></canvas>
  <div id="chips" class="chipbar">
    <span class="brand" title="Glowstack live map" aria-label="Glowstack live map"><img class="brand-mark" src="logo.svg" width="24" height="24" alt=""><b>Glowstack</b></span>
    <span id="badge" class="badge">connecting…</span>
  </div>
  <div id="mapControls" class="map-controls">
    <span class="seg" id="showSeg" role="group" aria-label="What the map shows">
      <button type="button" data-show="" disabled title="Waiting for the map to load">Preview</button><button type="button" data-show="house" disabled title="Waiting for the map to load">Lights</button>
    </span>
  </div>
  <nav id="crumbs" class="crumbs" aria-label="Selection" hidden></nav>
  <div id="legend" class="legend" hidden></div>
  <div id="inspectCard" class="inspect card" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="mapError" class="map-error" hidden></div>
  <div id="bootLoading" class="state loading boot-loading" role="status"><span class="spinner" aria-hidden="true"></span><div class="state-text"><b>Loading Glowstack…</b></div></div>
</main>

<aside id="panel" class="panel">
  <div id="handle" class="handle" aria-hidden="true"><i></i></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="looks" title="Looks"><span class="ico" data-icon="looks"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2l1.4 3.6L11.5 7 7.9 8.4 6.5 12 5.1 8.4 1.5 7l3.6-1.4zM12.5 10.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg></span><span class="lbl">Looks</span></button>
    <button type="button" role="tab" data-tab="presets" title="Presets"><span class="ico" data-icon="presets"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2.5h8a.5.5 0 0 1 .5.5v10.5L8 11l-4.5 2.5V3a.5.5 0 0 1 .5-.5z"/></svg></span><span class="lbl">Presets</span></button>
    <button type="button" role="tab" data-tab="setup" title="Setup"><span class="ico" data-icon="setup"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5L7.2 3.4L7.2 1.7L8.8 1.7L8.8 3.4L9.4 3.5L10.2 3.9L10.7 4.2L11.9 3.0L13.0 4.1L11.8 5.3L12.1 5.8L12.5 6.6L12.6 7.2L14.3 7.2L14.3 8.8L12.6 8.8L12.5 9.4L12.1 10.2L11.8 10.7L13.0 11.9L11.9 13.0L10.7 11.8L10.2 12.1L9.4 12.5L8.8 12.6L8.8 14.3L7.2 14.3L7.2 12.6L6.6 12.5L5.8 12.1L5.3 11.8L4.1 13.0L3.0 11.9L4.2 10.7L3.9 10.2L3.5 9.4L3.4 8.8L1.7 8.8L1.7 7.2L3.4 7.2L3.5 6.6L3.9 5.8L4.2 5.3L3.0 4.1L4.1 3.0L5.3 4.2L5.8 3.9zM8 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></span><span class="lbl">Setup</span></button>
    <button type="button" role="tab" data-tab="status" title="Status"><span class="ico" data-icon="status"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8.5h3l2-5 3 9 2-4h3"/></svg></span><span class="lbl">Status</span></button>
    <button type="button" id="railToggle" class="rail-toggle" title="Collapse the panel" aria-label="Collapse the panel"><span class="ico" data-icon="chevronRight"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></span></button>
  </div>
  <div id="content" class="content">
    <div id="offlineBanner" class="offline-banner" role="status" hidden>Lost the connection to Glowstack. Reconnecting; controls come back when it does.</div>
    <div id="inspectRow" class="inspect row" hidden></div>
    <!-- The Looks skeleton paints before app.js runs; the same markup as skeletonHTML('looks') in states.js. -->
    <section id="tab-looks" class="tab" role="tabpanel"><div class="skeleton" role="status" aria-busy="true" aria-label="Loading Looks…"><div class="looks-head"><span class="skel skel-title"></span></div><div class="stage skel-stage"><span class="skel skel-line"></span><span class="skel skel-row"></span><span class="skel skel-row"></span></div><div class="lib-filters"><span class="skel skel-seg"></span><span class="skel skel-seg"></span><span class="skel skel-seg"></span></div><div class="cards"><div class="preset skel-card"><span class="skel skel-strip"></span><span class="skel skel-name"></span><span class="skel skel-sub"></span></div><div class="preset skel-card"><span class="skel skel-strip"></span><span class="skel skel-name"></span><span class="skel skel-sub"></span></div><div class="preset skel-card"><span class="skel skel-strip"></span><span class="skel skel-name"></span><span class="skel skel-sub"></span></div><div class="preset skel-card"><span class="skel skel-strip"></span><span class="skel skel-name"></span><span class="skel skel-sub"></span></div><div class="preset skel-card"><span class="skel skel-strip"></span><span class="skel skel-name"></span><span class="skel skel-sub"></span></div><div class="preset skel-card"><span class="skel skel-strip"></span><span class="skel skel-name"></span><span class="skel skel-sub"></span></div></div></div></section>
    <section id="tab-presets" class="tab" role="tabpanel" hidden></section>
    <section id="tab-setup" class="tab" role="tabpanel" hidden></section>
    <section id="tab-status" class="tab" role="tabpanel" hidden></section>
  </div>
</aside>

<section id="calibrate" class="calibrate" hidden></section>

<div id="bootError" class="boot-error" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
