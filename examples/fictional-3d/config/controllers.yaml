schema: 1
controllers:
  - id: shed
    host: 192.0.2.21
    transport: ddp
    port: 4048
    channels: rgbw
    max_fps: 40
    # Outputs in WLED's order, numbered as WLED numbers them. Each starts
    # where the one before ends, so changing a count moves nothing else.
    outputs:
      - { output: 1, gpio: 16, count: 484, max_ma: 4000 }   # eave (+2 dead)
      - { output: 2, gpio: 3,  count: 120, max_ma: 2000 }   # tower
    power:
      max_ma: 5000
      led_ma: { r: 12, g: 12, b: 12, w: 20, idle: 1 }
    white: explicit

  - id: yard
    host: 192.0.2.22
    channels: rgb
    max_fps: 40
    outputs:
      - { output: 1, count: 390, max_ma: 4000 }   # fence, both sides of the gate
      - { output: 2, count: 90 }                  # porch rail
    power:
      led_ma: { r: 12, g: 12, b: 12, idle: 1 }
